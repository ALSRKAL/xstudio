<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with gradient -->
  <rect width="512" height="512" rx="96" fill="url(#gradient)"/>
  
  <!-- X Letter - Large and bold -->
  <path d="M160 144L256 256L160 368" stroke="white" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M352 144L256 256L352 368" stroke="white" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Sparkle effects -->
  <circle cx="384" cy="160" r="16" fill="white" opacity="0.8"/>
  <circle cx="416" cy="128" r="12" fill="white" opacity="0.6"/>
  <circle cx="128" cy="384" r="16" fill="white" opacity="0.8"/>
  <circle cx="96" cy="416" r="12" fill="white" opacity="0.6"/>
  
  <!-- Additional sparkles -->
  <circle cx="448" cy="192" r="8" fill="white" opacity="0.5"/>
  <circle cx="64" cy="320" r="8" fill="white" opacity="0.5"/>
  <circle cx="432" cy="240" r="6" fill="white" opacity="0.4"/>
  <circle cx="80" cy="272" r="6" fill="white" opacity="0.4"/>
  
  <!-- Gradient definition -->
  <defs>
    <linearGradient id="gradient" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#667eea"/>
